# Netlify build + serve config for LoopLab.
# Works as-is on Cloudflare Pages too (same build command / publish dir).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# The app uses HashRouter (routes live after #/), so no SPA rewrite rule is
# strictly required. This catch-all is a harmless safety net that serves
# index.html for any direct path hit.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
