<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LoopLab Test</title>
  <style>
    body { background: #111; color: white; font-family: sans-serif; padding: 40px; }
    .box { background: #222; border: 1px solid #444; border-radius: 8px; padding: 20px; max-width: 400px; }
    h1 { color: #a78bfa; }
    .js-test { color: #f87171; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🎛️ LoopLab</h1>

  </div>
  <script>
    document.getElementById('js-status').textContent = '✅ JavaScript is working';
    document.getElementById('js-status').style.color = '#4ade80';
  </script>
</body>
</html>
